[package]
name = "male-cns-native"
version = "5.7.1"
edition = "2024"
publish = false

[features]
default = ["desktop"]
desktop = ["dep:bevy", "dep:rfd", "dep:flate2", "dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
bevy = { version = "=0.18.1", optional = true, default-features = false, features = [
    "std", "async_executor", "bevy_winit", "multi_threaded", "bevy_log",
    "3d_bevy_render", "ui_bevy_render", "bevy_scene", "bevy_gizmos",
    "default_font", "png", "jpeg",
] }
bytemuck = { version = "1.25", optional = true }
chrono = { version = "=0.4.45", default-features = false, features = ["now"] }
flate2 = { version = "1", optional = true }
pollster = { version = "0.4", optional = true }
wgpu = { version = "=27.0.1", default-features = false, features = ["wgsl", "dx12", "vulkan", "std"], optional = true }
rfd = { version = "0.15", optional = true }
rquickjs = { version = "=0.14.0", features = ["array-buffer"] }
ryu-js = "=1.0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "float_roundtrip", "preserve_order"] }
sha2 = "0.10"

[profile.dev]
opt-level = 3
debug = 0

[profile.dev.package."*"]
opt-level = 2
